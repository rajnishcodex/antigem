name: Build and release RajnishGem

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Read release metadata
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version_name'])")
          python3 -c "import json; print('\n'.join(json.load(open('version.json')).get('changelog', [])))" > release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "RajnishGem-v${{ steps.meta.outputs.version }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: RajnishGem v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: RajnishGem-v${{ steps.meta.outputs.version }}.apk
